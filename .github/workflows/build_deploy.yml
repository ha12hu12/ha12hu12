name: Build and deploy code

on: push

jobs:
    job1:
        runs-on: ubuntu-latest
        steps:
            - name: pulling get repo
              uses: actions/checkout@v7.0.1
            - name: setup python
              uses: actions/setup-python@v7.0.0
              with:
                python-version: '3.9'
            - name: update pip
              run: python -m pip install --upgrade pip
            - name: download req
              run: pip install -r requirements.txt